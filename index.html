<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上海浮生记</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:40px 24px;
  background:linear-gradient(160deg,#1a1a2e 0%,#16213e 55%,#0f3460 100%);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;
  color:#eaeaea;
}
.card{
  width:100%;max-width:420px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:20px;
  padding:44px 32px;text-align:center;backdrop-filter:blur(10px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}
h1{
  font-size:40px;letter-spacing:5px;margin-bottom:6px;
  background:linear-gradient(90deg,#e94560,#f5a623);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.sub{font-size:15px;color:#a0a8c0;letter-spacing:3px;margin-bottom:34px}
.btn{
  display:block;width:100%;padding:17px 20px;margin-bottom:13px;
  background:linear-gradient(135deg,#e94560,#c23152);color:#fff;text-decoration:none;
  border-radius:13px;font-size:19px;font-weight:bold;letter-spacing:2px;
  border:none;cursor:pointer;transition:transform .15s,box-shadow .15s;
  box-shadow:0 6px 20px rgba(233,69,96,.32);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(233,69,96,.45)}
.btn:active{transform:translateY(0)}
.hint{margin-top:26px;font-size:13px;color:#8892a8;line-height:1.85}
.hint code{
  background:rgba(0,0,0,.35);padding:2px 7px;border-radius:5px;
  font-family:"Courier New",Consolas,monospace;font-size:12px;color:#c9d3e8;
}
.foot{margin-top:6px;font-size:12px;color:#5f6980}
</style>
</head>
<body>
<div class="card">
  <h1>上海浮生记</h1>
  <div class="sub">~ 终 章 ~</div>
  <a class="btn" href="./shanghai-life.html">开 始 游 戏</a>
  <div class="hint">
    单机文字冒险 · 30 天 · 无需联网<br>
    存档保存在你的浏览器本地
  </div>
</div>
<div class="foot">致敬文曲星 · 上海浮生记</div>
</body>
</html>
