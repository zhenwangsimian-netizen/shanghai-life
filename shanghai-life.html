<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海浮生记 ~终章~</title>
<style>
/* ===== 全局重置与基础（大字版 - 适老设计）===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#0d0d1a;
  color:#4ecca3;
  /* 关键：正常字体在前，Emoji 字体降为 fallback。
     Emoji 字体里的数字是全角宽字符，直接用会导致 100 显示成「1 0 0」。*/
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif,
              "Courier New","Consolas","Liberation Mono",monospace;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
/* 文曲星LCD复古绿 #4ecca3 / 深底 #0d0d1a */

/* ===== 主容器 ===== */
#app{
  width:100%;max-width:780px;height:100%;max-height:920px;
  display:flex;flex-direction:column;
  background:#1a1a2e;
  border:1px solid #2a2a4e;
  box-shadow:0 0 40px rgba(78,204,163,0.08);
  position:relative;overflow:hidden;
}

/* ===== 顶栏 ===== */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
  background:#111128;
  border-bottom:2px solid #2a2a4e;
  flex-shrink:0;
}
#topbar .title{font-size:24px;font-weight:bold;color:#4ecca3;letter-spacing:2px}
#topbar .title .sub{font-size:16px;color:#e94560;margin-left:8px}
#topbar .clock{font-size:18px;color:#8888aa;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-family:"SF Mono","Menlo","Consolas","Roboto Mono","Liberation Mono",monospace;letter-spacing:0}
#topbar .day{font-size:18px;color:#e94560;font-weight:bold;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-family:"SF Mono","Menlo","Consolas","Roboto Mono","Liberation Mono",monospace;letter-spacing:0}

/* ===== 内容区 ===== */
#content{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}

/* 状态面板 — 大字大数值 */
#statusbar{
  display:flex;flex-wrap:wrap;gap:1px;
  background:#2a2a4e;
  border-bottom:2px solid #2a2a4e;
  flex-shrink:0;
}
.stat-cell{
  flex:1;min-width:0;
  background:#111128;
  padding:8px 10px;
  display:flex;flex-direction:column;gap:3px;
}
.stat-cell .label{font-size:14px;color:#6666aa;letter-spacing:1px}
.stat-cell .value{
  font-size:clamp(14px,4.4vw,20px);
  font-weight:bold;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:0;
  /* 等宽数字：保证各格子数字宽度一致、竖向对齐 */
  font-family:"SF Mono","Menlo","Consolas","Roboto Mono","Liberation Mono",monospace;
}
.stat-cell .value.money{color:#ffd700}
.stat-cell .value.debt{color:#e94560}
.stat-cell .bar-wrap{height:10px;background:#222244;border-radius:5px;overflow:hidden;margin-top:4px}
.stat-cell .bar{height:100%;border-radius:5px;transition:width 0.3s}
.stat-cell .bar.hp{background:linear-gradient(90deg,#e94560,#ff6b6b)}
.stat-cell .bar.fame{background:linear-gradient(90deg,#4ecca3,#7fdbca)}

/* 消息区 — 大字阅读 */
#message{
  flex:1;padding:16px 18px;overflow-y:auto;
  font-size:19px;line-height:1.65;
  white-space:normal;
  word-break:normal;
  overflow-wrap:anywhere;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  letter-spacing:0;
  /* 正常字体在前；Emoji 字体仅作 fallback，避免数字被排成全角宽字符 */
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif,
              "Courier New","Consolas","Liberation Mono",monospace;
}
#message::-webkit-scrollbar{width:10px}
#message::-webkit-scrollbar-track{background:#111128}
#message::-webkit-scrollbar-thumb{background:#2a2a4e;border-radius:5px}

.msg-line{margin-bottom:4px}
.msg-line.event{color:#e94560;font-weight:bold}
.msg-line.warn{color:#ff9f43}
.msg-line.good{color:#4ecca3;font-weight:bold}
.msg-line.system{color:#6666aa;font-style:italic}
.msg-line.title{color:#e94560;font-size:24px;font-weight:bold;text-align:center;margin:10px 0}
.msg-line.decor{color:#444466;text-align:center}

/* 数值变化高亮动画 */
.flash-up{animation:flashGreen 0.6s}
.flash-down{animation:flashRed 0.6s}
@keyframes flashGreen{0%{color:#4ecca3;text-shadow:0 0 10px #4ecca3}100%{}}
@keyframes flashRed{0%{color:#e94560;text-shadow:0 0 10px #e94560}100%{}}

/* ===== 前进过一天 — 过渡动画 ===== */
#dayTransition{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0d0d1a 0%,#16213e 50%,#0f3460 100%);
  z-index:100;opacity:0;pointer-events:none;
}
#dayTransition.show{animation:dtFade 1.2s ease-in-out forwards}
@keyframes dtFade{
  0%{opacity:0;transform:scale(1.08)}
  20%{opacity:1;transform:scale(1)}
  80%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(0.96)}
}
#dayTransition .dt-day{
  font-size:clamp(48px,16vw,80px);font-weight:bold;letter-spacing:8px;
  background:linear-gradient(90deg,#e94560,#f5a623);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:12px;
}
#dayTransition .dt-sub{
  font-size:clamp(16px,5vw,22px);color:#8892a8;letter-spacing:6px;
}

/* ===== 按钮区 — 巨型按钮 ===== */
#buttons{
  padding:14px 16px;
  background:#111128;
  border-top:2px solid #2a2a4e;
  flex-shrink:0;
  min-height:90px;
}
.btn-grid{display:grid;gap:12px}
.btn-grid.cols2{grid-template-columns:repeat(2,1fr)}
.btn-grid.cols3{grid-template-columns:repeat(3,1fr)}
.btn-grid.cols4{grid-template-columns:repeat(4,1fr)}
.btn-grid.cols5{grid-template-columns:repeat(5,1fr)}

.btn{
  padding:20px 12px;
  background:#1a1a3e;
  border:2px solid #2e2e5e;
  color:#4ecca3;
  font-size:20px;
  font-family:"Courier New","Consolas","Liberation Mono","Microsoft YaHei",monospace;
  font-weight:bold;
  border-radius:10px;
  cursor:pointer;
  transition:all 0.15s;
  text-align:center;
  line-height:1.3;
  min-height:64px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
}
.btn:hover{
  background:#2a2a5e;border-color:#4ecca3;border-width:2px;
  box-shadow:0 0 12px rgba(78,204,163,0.3);
}
/* 触摸设备上 :hover 会「粘住」在最后点击的按钮上，并被新场景同位置的按钮继承，
   导致看起来有按钮无故高亮。因此只在真正支持悬停的设备上启用 hover 效果。*/
@media (hover:none){
  .btn:hover{
    background:#1a1a3e;border-color:#2e2e5e;border-width:2px;
    box-shadow:none;
  }
  .btn.primary:hover{background:#1e3a2e;box-shadow:none}
  .btn.danger:hover{background:#1a1a3e;box-shadow:none}
  .btn.warn:hover{background:#1a1a3e;box-shadow:none}
  .btn.disabled:hover{background:#1a1a3e;border-color:#2e2e5e;box-shadow:none}
}
.btn:focus{outline:none}
.btn:active{transform:scale(0.95)}
.btn .key{display:inline-block;font-size:14px;color:#8888aa;margin-left:4px;font-weight:normal}
.btn.primary{background:#1e3a2e;border-color:#4ecca3;color:#7fdbca}
.btn.primary:hover{background:#2a5a4e;box-shadow:0 0 16px rgba(78,204,163,0.4)}
.btn.danger{border-color:#e94560;color:#ff6b6b}
.btn.danger:hover{background:#3a1a2e;box-shadow:0 0 12px rgba(233,69,96,0.3)}
.btn.warn{border-color:#ff9f43;color:#ffb74d}
.btn.warn:hover{background:#3a2e1a;box-shadow:0 0 12px rgba(255,159,67,0.3)}
.btn.disabled{opacity:0.35;cursor:not-allowed}
.btn.disabled:hover{background:#1a1a3e;border-color:#2e2e5e;box-shadow:none}
.btn.big{padding:28px 12px;font-size:24px;min-height:80px}

/* 商品列表项 — 大字大行 */
.item-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:#111128;
  border:2px solid #222244;
  border-radius:10px;
  margin-bottom:10px;
  font-size:19px;
  flex-wrap:wrap;
}
.item-row .idx{
  width:36px;height:36px;border-radius:8px;background:#2a2a4e;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#8888aa;flex-shrink:0;font-weight:bold;
}
.item-row .name{min-width:50px;color:#4ecca3;font-weight:bold;font-size:21px}
.item-row .qty{color:#ffd700;min-width:70px;font-size:19px}
.item-row .price{color:#7fdbca;min-width:90px;font-size:19px}
.item-row .closed{color:#e94560;font-size:17px;flex:1}
.item-row .actions{margin-left:auto;display:flex;gap:8px}
.item-row .act-btn{
  padding:12px 20px;font-size:19px;border-radius:8px;min-height:52px;font-weight:bold;
}

/* ===== 商品卡片网格 — 价格常显（核心修复）=====
   原版用 LOCATE 定位打印，不营业的位置被 PRINT " " 覆盖成空白，
   视觉上像"价格变了"。这里改为：价格永远可见，
   不营业时灰显+划线并另标"今日歇业"。 */
.goods-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.goods-grid.cols4{grid-template-columns:repeat(4,1fr)}
.goods-grid.cols1{grid-template-columns:1fr}
.goods-card{
  background:#111128;
  border:2px solid #2e2e5e;
  border-radius:12px;
  padding:14px 10px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;
  min-height:140px;
  text-align:center;
}
.goods-card .g-ico{font-size:38px;line-height:1.1}
.goods-card .g-name{font-size:19px;font-weight:bold;color:#4ecca3;line-height:1.2}
.goods-card .g-price{
  font-size:22px;font-weight:bold;color:#ffd700;line-height:1.25;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  text-align:center;white-space:nowrap;
  font-family:"SF Mono","Menlo","Consolas","Roboto Mono","Liberation Mono",monospace;
}
.goods-card .g-stock{
  font-size:15px;color:#8888aa;line-height:1.25;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  text-align:center;white-space:nowrap;
  font-family:"SF Mono","Menlo","Consolas","Roboto Mono","Liberation Mono",monospace;
}
.goods-card .g-tag{font-size:15px;color:#e94560;line-height:1.2;font-weight:bold}
.goods-card .g-act{
  margin-top:8px;width:100%;
  padding:10px 6px;font-size:19px;border-radius:8px;min-height:50px;font-weight:bold;
}
/* 今日歇业：不显示价格，红字红线 */
.goods-card.closed{background:#0f0f20;border-color:#3a3a5e}
.goods-card.closed .g-name{color:#6a6a8a}
.goods-card.closed .g-closed{color:#e94560;font-size:18px;font-weight:bold;border-top:2px solid #e94560;border-bottom:2px solid #e94560;padding:4px 0;width:100%;line-height:1.3}
.goods-card.closed .g-ico{opacity:.45}
/* 可交易时描边高亮 */
.goods-card.buyable{border-color:#4ecca3;box-shadow:0 0 12px rgba(78,204,163,.18)}
/* 紧凑模式（主界面概览用） */
.goods-grid.compact .goods-card{min-height:112px;padding:10px 6px}
.goods-grid.compact .goods-card .g-ico{font-size:30px}
.goods-grid.compact .goods-card .g-name{font-size:17px}
.goods-grid.compact .goods-card .g-price{font-size:18px}
.goods-grid.compact .goods-card .g-stock{font-size:13px}

/* ===== 按钮内大图标（双行）===== */
.btn .b-ico{display:block;font-size:38px;line-height:1.15;margin-bottom:2px}

/* ===== SVG 图标（不依赖 Emoji 字体）===== */
.ico-img{display:block;width:100%;height:100%;object-fit:contain}
.g-ico-img{width:38px;height:38px}
.b-ico-img{width:38px;height:38px}
.btn.big .b-ico-img{width:44px;height:44px}
.goods-grid.compact .g-ico-img{width:30px;height:30px}
.btn .b-txt{display:block;font-size:22px;font-weight:bold;line-height:1.2}
.btn.big .b-ico{font-size:44px}
.btn.big .b-txt{font-size:24px}
.btn .key{display:block;font-size:14px;color:#8888aa;font-weight:normal;margin-top:3px}

/* 人物头像（场景消息中展示） */
.msg-portrait{display:inline-block;vertical-align:middle;width:48px;height:48px;margin-right:8px;border-radius:8px;background:#111128;border:1px solid #2a2a4e;padding:4px}
.msg-portrait img{width:100%;height:100%;object-fit:contain}
.portrait-line{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.portrait-line .portrait-text{flex:1;min-width:0;font-size:19px;line-height:1.7;word-break:break-word;overflow-wrap:anywhere}

/* ===== 装饰字符字体栈 =====
   注意：#clock / #dayLabel / .stat-cell .value 全部是数字，
   绝不能放进 Emoji 字体栈 —— Emoji 字体的数字是全角宽字符，
   会把 100 排成「1 0 0」、把 ¥1,000 撑到截断。
   所有功能性图标已改为内联 SVG，不再依赖 Emoji 字体。*/
.intro-stars{
  font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Twemoji Mozilla","EmojiOne Color","Android Emoji",sans-serif;
}

/* 数字输入面板 — 大字大输入框 */
#input-panel{
  padding:14px 16px;background:#111128;border-top:2px solid #2a2a4e;flex-shrink:0;
}
#input-panel .prompt{font-size:20px;color:#8888aa;margin-bottom:12px;line-height:1.5}
#input-panel .input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#input-panel input{
  flex:1;min-width:120px;
  padding:16px;
  background:#0d0d1a;border:2px solid #2e2e5e;
  color:#4ecca3;font-size:24px;
  font-family:"Courier New","Consolas","Liberation Mono","Microsoft YaHei",monospace;
  border-radius:10px;text-align:center;
  min-height:56px;
}
#input-panel input:focus{outline:none;border-color:#4ecca3}
#input-panel .quick-btns{display:flex;gap:8px;flex-wrap:wrap}
#input-panel .quick-btns .btn{padding:14px 18px;font-size:19px;min-height:52px}

/* 开场动画层 */
#intro{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:#0d0d1a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;
  transition:opacity 0.8s;
}
#intro.hide{opacity:0;pointer-events:none}
#intro .intro-circle{
  width:200px;height:200px;
  border:2px solid #4ecca3;border-radius:50%;
  position:absolute;
  animation:introCircle 2s ease-out forwards;
}
@keyframes introCircle{
  0%{width:20px;height:20px;border-width:3px;opacity:0}
  100%{width:300px;height:300px;border-width:1px;opacity:0.3}
}
#intro .intro-title{
  font-size:36px;font-weight:bold;color:#4ecca3;
  letter-spacing:4px;
  text-shadow:0 0 20px rgba(78,204,163,0.4);
  position:relative;z-index:1;
  text-align:center;width:100%;
}
#intro .intro-title span{display:inline-block;opacity:0;animation:fadeInChar 0.3s forwards}
@keyframes fadeInChar{to{opacity:1}}
#intro .intro-sub{
  margin-top:16px;font-size:22px;color:#e94560;
  opacity:0;animation:fadeInChar 0.5s 1.5s forwards;
  text-align:center;width:100%;
}
#intro .intro-author{
  margin-top:32px;font-size:16px;color:#6666aa;
  opacity:0;animation:fadeInChar 0.5s 2s forwards;
}
#intro .intro-stars{
  position:absolute;font-size:12px;color:#222244;
  white-space:pre;line-height:1;bottom:10%;left:0;width:100%;text-align:center;
}

/* 响应式 — 小屏适配仍保持大字 */
@media(max-width:600px){
  #topbar{padding:10px 14px}
  #topbar .title{font-size:20px}
  #topbar .clock,#topbar .day{font-size:15px}
  .stat-cell{min-width:0;padding:8px 8px}
  .stat-cell .label{font-size:13px}
  .stat-cell .value{font-size:clamp(13px,4.4vw,18px)}
  .btn{padding:16px 8px;font-size:18px;min-height:56px}
  .btn.big{padding:22px 8px;font-size:21px;min-height:68px}
  .btn .key{font-size:12px}
  #message{font-size:19px;padding:14px;line-height:1.9}
  #input-panel input{font-size:22px;padding:14px}
  #input-panel .quick-btns .btn{font-size:17px;padding:12px 14px}
  .item-row{font-size:17px;padding:12px;gap:8px}
  .item-row .name{font-size:19px}
  .item-row .act-btn{font-size:17px;padding:10px 16px;min-height:48px}
  .goods-grid{gap:8px}
  .goods-grid.cols4{grid-template-columns:repeat(4,1fr)}
  .goods-card{min-height:112px;padding:10px 6px}
  .goods-card .g-ico{font-size:30px}
  .goods-card .g-name{font-size:17px}
  .goods-card .g-price{font-size:18px}
  .goods-card .g-stock{font-size:13px}
  .goods-card .g-act{font-size:17px;min-height:44px;padding:8px 4px}
  .btn .b-ico{font-size:30px}
  .btn .b-txt{font-size:19px}
  .btn.big .b-ico{font-size:34px}
  .g-ico-img{width:30px;height:30px}
  .b-ico-img{width:30px;height:30px}
  .btn.big .b-ico-img{width:34px;height:34px}
  .btn.big .b-txt{font-size:21px}
  #intro .intro-title{font-size:28px}
}
</style>
</head>
<body>
<div id="app">

  <!-- 开场动画 -->
  <div id="intro">
    <div class="intro-circle"></div>
    <div class="intro-title" id="introTitle"></div>
    <div class="intro-sub">~终章~</div>
    <div class="intro-author">PRESENT BY 真忘</div>
    <div class="intro-stars">★ ♦ ♠ ☆ ✿</div>
  </div>

  <!-- 顶栏 -->
  <div id="topbar">
    <div class="title">上海浮生记<span class="sub">~终章~</span></div>
    <div style="display:flex;gap:16px;align-items:center">
      <div class="clock" id="clock">--:--</div>
      <div class="day" id="dayLabel">第1天</div>
    </div>
  </div>

  <!-- 内容区 -->
  <div id="content">
    <!-- 状态栏 -->
    <div id="statusbar">
      <div class="stat-cell">
        <div class="label">资金</div>
        <div class="value money" id="vMoney">¥1000</div>
      </div>
      <div class="stat-cell">
        <div class="label">欠款</div>
        <div class="value debt" id="vDebt">¥5000</div>
      </div>
      <div class="stat-cell">
        <div class="label">体力</div>
        <div class="value" id="vHp">100</div>
        <div class="bar-wrap"><div class="bar hp" id="barHp" style="width:100%"></div></div>
      </div>
      <div class="stat-cell">
        <div class="label">名声</div>
        <div class="value" id="vFame">100</div>
        <div class="bar-wrap"><div class="bar fame" id="barFame" style="width:100%"></div></div>
      </div>
    </div>

    <!-- 消息区 -->
    <div id="message"></div>

    <!-- 输入面板（动态显示/隐藏） -->
    <div id="input-panel" style="display:none">
      <div class="prompt" id="inputPrompt"></div>
      <div class="input-row" id="inputRow"></div>
    </div>

    <!-- 按钮区（动态填充） -->
    <div id="buttons"></div>
  </div>

  <!-- 前进过一天 — 过渡动画覆盖层 -->
  <div id="dayTransition">
    <div class="dt-day" id="dtDayText">第1天</div>
    <div class="dt-sub" id="dtSubText">新的一天开始了</div>
  </div>
</div>

// 格式化金额
function fmtMoney(v){
  v = int(v);
  if(v<0) v=0;
  return '¥' + v.toLocaleString('zh-CN');
}

// 状态栏专用：紧凑金额（万/亿缩写），保证窄屏永远显示得下、不截断
function fmtMoneyShort(v){
  v = int(v);
  if(v<0) v=0;
  if(v >= 100000000){
    var y = v / 100000000;
    return '¥' + (y >= 100 ? y.toFixed(0) : y.toFixed(y >= 10 ? 1 : 2)) + '亿';
  }
  if(v >= 10000){
    var w = v / 10000;
    return '¥' + (w >= 100 ? w.toFixed(0) : w.toFixed(w >= 10 ? 1 : 2)) + '万';
  }
  return '¥' + v.toLocaleString('zh-CN');
}

// ===== Web Audio 蜂鸣 =====
var audioCtx = null;
function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type='square';
    osc.frequency.value=880;
    gain.gain.value=0.15;
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+0.12);
  }catch(e){}
}

}

// mode: 'buy' | 'sell' | 'view'
function renderGoodsCards(mode, opts){
  opts = opts || {};
  var grid = document.createElement('div');
  grid.className = 'goods-grid' + (opts.cols4?' cols4':'') + (opts.compact?' compact':'');
  elMessage.appendChild(grid);

  for(var i=0;i<8;i++){
    var it = ITEMS[i];
    var open = (mode === 'buy') ? isBuyOpen(i)
             : (mode === 'sell') ? isSellOpen(i)
             : true;

    var card = document.createElement('div');
    card.className = 'goods-card' + (open?'':' closed') + (mode!=='view'&&open?' buyable':'');

    // 图标（SVG，不依赖字体）
    var ico = document.createElement('div');
    ico.className = 'g-ico';
    ico.innerHTML = icoImg(SVG_ITEMS[i], 'g-ico-img');
    card.appendChild(ico);

    // 名称
    var name = document.createElement('div');
    name.className = 'g-name';
    name.textContent = it.name;
    card.appendChild(name);

    // 今日价 —— 营业时显示价格；歇业时不显示价格，直接红字"今日歇业"
    if(open){
      var price = document.createElement('div');
      price.className = 'g-price';
      price.textContent = '¥' + G.price[i];
      card.appendChild(price);
    }else{
      var closedTag = document.createElement('div');
      closedTag.className = 'g-price g-closed';
      closedTag.textContent = '今日歇业';
      card.appendChild(closedTag);
    }

    // 库存
    var stock = document.createElement('div');
    stock.className = 'g-stock';
    stock.textContent = '库存 ' + G.stock[i];
    card.appendChild(stock);

    // 营业时显示买卖按钮（歇业标记已在价格位置显示）
    if(open && mode === 'buy'){
      var bb = document.createElement('button');
      bb.className = 'btn g-act primary';
      bb.textContent = '买入';
      bb.onclick = (function(idx){return function(){buyItem(idx)}})(i);
      card.appendChild(bb);
    }else if(mode === 'sell'){
      var sb = document.createElement('button');
      sb.className = 'btn g-act warn';
      sb.textContent = '卖出';
      sb.onclick = (function(idx){return function(){sellItem(idx)}})(i);

    grid.appendChild(card);
  }
  return grid;
}

// ===== 按钮渲染 =====
// cfg.icon → 大图标（文曲星图形字符的 Emoji 等价），显示为双行结构
function renderButtons(config){
  elButtons.innerHTML = '';
  var grid = document.createElement('div');
  grid.className = 'btn-grid cols' + (config.cols||2);
  config.buttons.forEach(function(cfg){
    var b = document.createElement('button');
    b.className = 'btn' + (cfg.primary?' primary':'') + (cfg.danger?' danger':'') + (cfg.warn?' warn':'') + (cfg.big?' big':'') + (cfg.disabled?' disabled':'');
    if(cfg.svg){
      // SVG 图标 + 文字 双行（不依赖字体，任何设备都能显示）
      b.innerHTML = '<span class="b-ico">' + icoImg(cfg.svg, 'b-ico-img') + '</span>' +
                    '<span class="b-txt">' + cfg.label + '</span>' +
                    (cfg.key ? '<span class="key">[' + cfg.key + ']</span>' : '');
    }else if(cfg.icon){
      // 图标 + 文字 双行
      b.innerHTML = '<span class="b-ico">' + cfg.icon + '</span>' +
                    '<span class="b-txt">' + cfg.label + '</span>' +
                    (cfg.key ? '<span class="key">[' + cfg.key + ']</span>' : '');
    }else{
      var html = cfg.label;
      if(cfg.key) html += '<span class="key">['+cfg.key+']</span>';
      b.innerHTML = html;
    }
    if(!cfg.disabled){
      b.onclick = function(){
        if(cfg.onClick) cfg.onClick();
      };
    }
    grid.appendChild(b);
  });
  // 清除残留焦点，防止移动端按钮高亮
  if(document.activeElement && document.activeElement.blur){
    document.activeElement.blur();
  }
  elButtons.appendChild(grid);
}

// ===== 数字输入面板 =====
function showInputPanel(promptText, defaultValue, onConfirm, opts){
  opts = opts||{};
  elInputPanel.style.display = 'block';
  elInputPrompt.textContent = promptText;

  elInputRow.innerHTML = '';
  var input = document.createElement('input');
  input.type = 'number';
  input.min = '0';
  input.step = '1';
  input.value = defaultValue != null ? defaultValue : '';
  input.placeholder = '输入数字（不可为负）';
  elInputRow.appendChild(input);

  // 快捷按钮
  var quickDiv = document.createElement('div');
  quickDiv.className = 'quick-btns';

  if(opts.quickBtns){
    opts.quickBtns.forEach(function(qb){
      var qb_btn = document.createElement('button');
      qb_btn.className = 'btn';
      qb_btn.textContent = qb.label;
      qb_btn.onclick = function(){
        input.value = qb.value;
        input.focus();
      };
      quickDiv.appendChild(qb_btn);
    });
  }

  var okBtn = document.createElement('button');
  okBtn.className = 'btn primary';
  okBtn.textContent = '确认';
  okBtn.onclick = function(){
    var v = parseInt(input.value, 10);
    if(isNaN(v) || v < 0) v = 0;   // 负数一律视为 0（放弃）
    hideInputPanel();
    onConfirm(v);
  };
  quickDiv.appendChild(okBtn);

  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn danger';
  cancelBtn.textContent = '放弃(0)';
  cancelBtn.onclick = function(){
    hideInputPanel();
    onConfirm(0);
  };
  quickDiv.appendChild(cancelBtn);

  elInputRow.appendChild(quickDiv);

  setTimeout(function(){input.focus();input.select()},50);

  // 拦截负数：任何途径都保证不出现负值
  var clampNonNegative = function(){
    var raw = input.value;
    if(raw === '' || raw === '-') return;
    var n = parseInt(raw, 10);
    if(isNaN(n)){ input.value = ''; return; }
    if(n < 0) input.value = '0';
  };
  input.addEventListener('input', clampNonNegative);
  input.addEventListener('blur', clampNonNegative);
  input.addEventListener('change', clampNonNegative);

  // Enter 确认
  input.onkeydown = function(e){
    if(e.key==='-'){e.preventDefault(); return false;}
    if(e.key==='Enter'){
      e.preventDefault();
      clampNonNegative();
      var v = parseInt(input.value, 10);
      if(isNaN(v) || v < 0) v = 0;
      hideInputPanel();
      onConfirm(v);
    }
  };
}

function hideInputPanel(){
  elInputPanel.style.display='none';
  // 清空残留内容，避免隐藏的旧按钮被误点
  elInputRow.innerHTML = '';
  elInputPrompt.textContent = '';
}

// ===== 价格生成（第110-180行）=====
function genPrices(){
  for(var i=0;i<8;i++){
    var it = ITEMS[i];
    var p;
    do{
      p = int((Math.random()+0.1)*it.base);
    }while(p<=it.min-1); // 原代码 IF p<=下限 GOTO 重投
    // 原代码是 IF p<=0 / IF p<=5 等，下限是 min，p必须 > min-1 即 >= min
    // 但原代码 IF MP<=0 GOTO 110, min为1，即 p>0
    // 实际：p = INT((RND+0.1)*base)，若 p <= 下限重投
    // 下限分别是 0,5,10,50,100,500,1000,5000
    G.price[i] = p;
  }
}

// 用原始下限重新生成（更忠实原代码）
function genPricesOriginal(){
  var mins = [0,5,10,50,100,500,1000,5000];
  for(var i=0;i<8;i++){
    var p;
    do{
      p = int((Math.random()+0.1)*ITEMS[i].base);
    }while(p<=mins[i]);
    G.price[i] = p;
  }
}

// ===== 营业判定 =====
// 买入：price % buyDiv !== 0 → 正常营业；=== 0 → 不营业
// 卖出：price % sellDiv !== 0 → 正常营业；=== 0 → 不营业
function isBuyOpen(i){
  if(G.day===30 || G.lock[i]) return true; // 最后一天/事件锁定后强制开放
  return G.price[i] % ITEMS[i].buyDiv !== 0;
}
function isSellOpen(i){
  if(G.day===30 || G.lock[i]) return true;
  return G.price[i] % ITEMS[i].sellDiv !== 0;
}

// ===== 仓库总容量 =====
function totalCap(){return 100+G.cap}
function totalStock(){
  var s=0;
  for(var i=0;i<8;i++) s+=G.stock[i];
  return s;
}

// 买入商品（第710-789行）
function buyItem(i){
  var it = ITEMS[i];
  var open = isBuyOpen(i);
  if(!open){
    clearMsg();
    msg('※  今天没人在这里做' + it.name + '生意啊？（今日价 ¥' + G.price[i] + '）','warn');
    waitKey(showMarket);
    return;
  }

  clearMsg();
  msg(it.name + '      库存 ' + G.stock[i]);
  msg('今日单价 ¥' + G.price[i] + '    资金 ' + fmtMoney(G.money));
  msg('买多少？', 'warn');

  // 计算最大可买量
  var maxByMoney = int(G.money / G.price[i]);
  var maxByCap = totalCap() - totalStock();
  var maxBuy = Math.min(maxByMoney, maxByCap);
  if(maxBuy < 0) maxBuy = 0;

  showInputPanel(
    '买入数量（最大'+maxBuy+'）',
    '',
    function(qty){
      qty = int(qty);
      doBuy(i, qty);
    },
    {
      quickBtns:[
        {label:'+1', value:1},
        {label:'+10', value:10},
        {label:'最大', value:maxBuy}
      ]
    }
  );
}

function doBuy(i, qty){
  hideInputPanel();
  qty = int(qty);
  if(qty < 0) qty = 0;   // 负数禁止
  var it = ITEMS[i];

  // 第713行：qty=0 → 放弃
  if(qty === 0){
    clearMsg();
    msg('·  放弃买进' + it.name + '！','warn');
    waitKey(showMarket);
    return;
  }
  // 第714行：qty<0 → 错误
  if(qty < 0){
    clearMsg();
    msg('※  错误！','event');
    waitKey(function(){buyItem(i)});
    return;
  }
  // 第715行：资金不够
  if(qty * G.price[i] > G.money){
    clearMsg();
    msg('※  资金不够！','event');
    waitKey(function(){buyItem(i)});
    return;
  }
  // 第716行：仓库不够
  if(totalStock() + qty > totalCap()){
    clearMsg();
    msg('※  仓库太小','event');
    waitKey(function(){buyItem(i)});
    return;
  }

  // 第717行：扣钱+加库存
  G.money = int(G.money - qty * G.price[i]);
  G.stock[i] = int(G.stock[i] + qty);
  if(G.stock[i] > totalCap()) G.stock[i] = totalCap();

  clearMsg();
  msg(it.name + '      库存 ' + G.stock[i]);
  msg('今日单价 ¥' + G.price[i] + '    资金 ' + fmtMoney(G.money));
  msg('√  买了 ' + qty + ' 个' + it.name, 'good');
  updateStatus();
  waitKey(showMarket);
}

function doSell(i, qty){
  hideInputPanel();
  qty = int(qty);
  if(qty < 0) qty = 0;   // 负数禁止
  var it = ITEMS[i];

  // 第913行：qty=0 → 放弃

    msg('·  放弃卖出' + it.name + '！','warn');

  if(qty < 0 || qty > 150){
    clearMsg();
    msg('※  错误！','event');
    waitKey(function(){sellItem(i)});
    return;
  }
  // 第915行：库存不够
  if(qty > G.stock[i]){
    clearMsg();
    msg('※  仓库里可没那么多！','event');
    waitKey(function(){sellItem(i)});
    return;
  }

  // 第916行：加钱+减库存
  G.money = int(G.money + qty * G.price[i]);
  G.stock[i] = int(G.stock[i] - qty);
  if(G.stock[i] < 0) G.stock[i] = 0;

  clearMsg();
  msg(it.name + '      库存 ' + G.stock[i]);
  msg('今日单价 ¥' + G.price[i] + '    资金 ' + fmtMoney(G.money));
  msg('√  卖了 ' + qty + ' 个' + it.name, 'good');
  updateStatus();

  // 第968/978行：卖劣酒/禁书名声下降
  if(qty !== 0 && it.fameCost > 0){
    waitKey(function(){
      clearMsg();
      msg('※  卖' + it.name + '我名声下降了！','event');
      G.fame = int(G.fame - it.fameCost);
      if(G.fame < 0) G.fame = 0;
      updateStatus();
      waitKey(showWarehouse);
    });
  }else{
    waitKey(showWarehouse);
  }
}

function doPay(hq){
  hideInputPanel();
  hq = int(hq);

  // 第1253行：0 → 不还

    clearMsg();
    msg('×  不还？' + G.name + ' 你小子有种等着瞧！','event');

  // 第1254行：钱不够

    waitKey(askPayAmount);

  // 第1256行：还多了

    msg(G.name + ' 你也不欠我这么多钱吧？','warn');

    waitKey(function(){

      msgHTML('<div class="portrait-line"><span class="msg-portrait">' + icoImg(SVG.postman,'ico-img') + '</span><span class="portrait-text">记住下次多汇点来！有借有还，再借不难！</span></div>','warn');

    });
  }
}

  msg('★  下面来看看你的成绩！');

  var goodsValue = 0;
  for(var i=0;i<8;i++){
    goodsValue += G.price[i] * G.stock[i];
  }
  G.money = int(G.money + goodsValue * 0.9);

  // 第2003行：MARK = money * fame/100 - (100-hp)*1500*RND
  // 有禁书 → fame-=10；有劣酒 → fame-=5
  if(G.stock[6] !== 0) G.fame = int(G.fame - 10);
  if(G.stock[5] !== 0) G.fame = int(G.fame - 5);
  if(G.fame < 0) G.fame = 0;

  var mark = int(G.money * G.fame / 100 - int(100 - G.hp) * 1500 * Math.random());
  if(mark < 0) mark = 0;

  G.hp = int(G.hp);
  G.debt = int(G.debt);
  G.fame = int(G.fame);

  waitKey(function(){
    // 第2006行：统计表
    clearMsg();
    msg(G.name + ' 的统计表：', 'title');
    msg('资金 ' + fmtMoney(G.money));
    msg('欠款 ' + fmtMoney(G.debt));
    msg('体力 ' + G.hp + '    名声 ' + G.fame);
    msg('FP = ' + mark, 'good');

    waitKey(function(){

      if(G.debt !== 0){

function loadGame(){

    var loaded = JSON.parse(s);
    // 恢复全部状态
    G = loaded;
    // 确保数组完整
    if(!G.stock) G.stock=[0,0,0,0,0,0,0,0];

    if(!G.lock) G.lock=[0,0,0,0,0,0,0,0];

}

// ============================================================
// 键盘快捷键
// ============================================================
document.addEventListener('keydown', function(e){
  // 如果焦点在输入框，不处理快捷键（Enter由input自己处理）
  if(e.target.tagName === 'INPUT') return;

  var key = e.key;
  var lower = key.toLowerCase();

  // 全局：ESC 退出到标题
  if(key === 'Escape'){
    e.preventDefault();
    if(G.scene === SCENE.MAIN){
      confirmQuit();
    }
    return;
  }

  // 主界面快捷键
  if(G.scene === SCENE.MAIN){
    if(lower === 'g'){e.preventDefault();advanceDay();return}
    if(key === 'F2'){e.preventDefault();showGoOut();return}
    if(key === 'F3'){e.preventDefault();showWarehouse();return}
    if(key === 'F4'){e.preventDefault();showMarket();return}
    if(key === 'F1'){e.preventDefault();showHelp();return}
    if(lower === 'q'){
      e.preventDefault();
      // Q 在仓库/市场/外出等子场景返回主界面
      showMain();
      return;
    }
  }

  // 仓库/市场/外出 Q返回
  if(G.scene === SCENE.WAREHOUSE || G.scene === SCENE.MARKET || G.scene === SCENE.GOOUT){
    if(lower === 'q'){e.preventDefault();showMain();return}
    if(key === 'F2'){e.preventDefault();showGoOut();return}
    if(key === 'F3' && G.scene !== SCENE.WAREHOUSE){e.preventDefault();showWarehouse();return}
    if(key === 'F4' && G.scene !== SCENE.MARKET){e.preventDefault();showMarket();return}
  }

  // 标题屏：L读档，Enter开始
  if(G.scene === SCENE.TITLE){
    if(lower === 'l'){e.preventDefault();afterTitleChoice('load');return}
    if(key === 'Enter'){e.preventDefault();afterTitleChoice('start');return}
  }

  // 网吧：S存档 L读档
  if(G.scene === SCENE.NETBAR){
    if(lower === 's'){e.preventDefault();saveGame();return}
    if(lower === 'l'){e.preventDefault();
      if(loadGame()){
        G.saveUsed = 1;
        msg('√  资料读取成功！','good');
        waitKey(showMain);
      }
      return;
    }
  }

  // 帮助界面 Q返回
  if(G.scene === SCENE.HELP || G.scene === SCENE.HELPINTRO){
    if(lower === 'q'){e.preventDefault();showMain();return}
  }

  // 等待按键时 Enter/Space 继续
  if(_waitKeyCb && (key === 'Enter' || key === ' ')){
    e.preventDefault();
    var cb = _waitKeyCb;
    _waitKeyCb = null;
    cb();
    return;
  }
});

// ============================================================
// 隐藏秘籍系统（源码第33-46行）
// 完整按键序列(12步): →→←←↓↑↓↑ b a b a
// 文曲星ASC: 20=→ 21=← 22=↑ 23=↓ 98='b' 97='a'
// 在标题屏按此序列激活无敌模式，激活时 BEEP×5
// ============================================================
var _cheatState = 0;
var _cheatSeq = [20,20,21,21,23,22,23,22,98,97,98,97];

document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'INPUT') return;

  // 仅在标题屏生效
  if(G.scene !== SCENE.TITLE) return;
  if(G.cheatGod) return; // 已激活

  var code = null;
  if(e.key === 'ArrowRight')      code = 20; // →
  else if(e.key === 'ArrowLeft')  code = 21; // ←
  else if(e.key === 'ArrowUp')    code = 22; // ↑
  else if(e.key === 'ArrowDown')  code = 23; // ↓
  else if(e.key.toLowerCase() === 'b') code = 98;
  else if(e.key.toLowerCase() === 'a') code = 97;

  if(code === null) return;
  e.preventDefault();

  if(code === _cheatSeq[_cheatState]){
    _cheatState++;
    if(_cheatState === _cheatSeq.length){
      // 全部匹配 → 激活！
      G.cheatGod = 1;
      _cheatState = 0;
      beep();beep();beep();beep();beep();
      msg('★ ' + '√  隐藏模式已激活 ★', 'good');
    }
  }else{
    // 不匹配：如果当前输入是序列第一步则从1开始，否则归零
    _cheatState = (code === _cheatSeq[0]) ? 1 : 0;
  }
});

// 启动
// ============================================================
newGame();
G.scene = SCENE.TITLE;
startIntro();
